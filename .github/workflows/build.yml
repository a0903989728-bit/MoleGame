name: Android Build CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 下載程式碼 (已更新為 v4)
    - uses: actions/checkout@v4

    # 2. 設定 Java 環境 (已更新為 v4，預設使用 JDK 17)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. 給予 Gradle 執行權限
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. 執行打包指令
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    # 5. 上傳打包好的 APK (這就是您原本報錯的地方，已修復為 v4)
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        # 這裡設定搜尋所有產生的 apk 檔案
        path: app/build/outputs/apk/**/*.apk
        compression-level: 0 # 選擇性：設為 0 上傳速度最快
