name: Build Android APK (Stable Pygame)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. 改回 Java 17 (對應 Buildozer 預設的 NDK r25b)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 2. 安裝必要的編譯工具
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev \
            libssl-dev zip unzip autoconf automake \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            autopoint gettext libltdl-dev libsqlite3-dev

      # 3. 安裝 Buildozer (不指定 cython，讓它自動決定)
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer

      # 4. 產生設定檔
      - name: Create buildozer.spec
        run: |
          rm -f buildozer.spec
          buildozer init
          
          # 修改標題與包名
          sed -i 's/title = My Application/title = Mole Game/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = molegame/' buildozer.spec
          sed -i 's/package.domain = org.test/package.domain = org.test/' buildozer.spec
          
          # 加入檔案格式
          sed -i 's/source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py,png,jpg,kv,atlas,ttf,mp3,wav/' buildozer.spec
          
          # 指定 pygame
          sed -i 's/requirements = python3,kivy/requirements = python3,pygame/' buildozer.spec
          
          # 橫向螢幕
          sed -i 's/orientation = portrait/orientation = landscape/' buildozer.spec
          
          # ⚠️ 關鍵：不要用 master 分支，使用預設穩定版
          # (這裡我移除了 p4a.branch 的修改指令)
          
          # 只編譯 arm64
          sed -i 's/android.archs = arm64-v8a, armeabi-v7a/android.archs = arm64-v8a/' buildozer.spec

          # 同意授權
          sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/# android.install_test_packages = False/android.install_test_packages = True/' buildozer.spec

      # 5. 清理舊環境 (避免之前的失敗檔案殘留)
      - name: Clean Environment
        run: |
          buildozer android clean

      # 6. 開始打包
      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoleGame-Android
          path: bin/*.apk
