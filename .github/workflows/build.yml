name: Build Python Game (Windows)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    # 1. 下載你的程式碼
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. 設定 Python 環境
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. 安裝遊戲需要的函式庫 (假設你有用 pygame)
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pygame pyinstaller
        # 如果你有用到其他套件，請在這裡補上，例如: pip install numpy

    # 4. 開始打包成 .exe
    - name: Build with PyInstaller
      run: |
        # --onefile 代表打包成單一檔案
        # --noconsole 代表執行時不要跳出黑底白字的視窗 (視窗遊戲通常需要這個)
        # --add-data 用來把音樂和字型包進去 (Windows語法是用分號 ; 分隔)
        pyinstaller --onefile --noconsole --name "MoleGame" --add-data "game.mp3;." --add-data "menu.mp3;." --add-data "font.ttf;." main.py

    # 5. 上傳打包好的 .exe 檔案
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MoleGame-Windows-Exe
        path: dist/MoleGame.exe
