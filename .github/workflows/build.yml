name: Build Android APK (Ubuntu 22.04)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-android:
    # 關鍵修改：強制使用 Ubuntu 22.04 (這版本才有 libtinfo5)
    runs-on: ubuntu-22.04

    steps:
      # 1. 下載程式碼
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 設定 Java 11 (Buildozer 在 22.04 上配 Java 11 最穩)
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 3. 設定 Python 3.10
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 4. 安裝系統依賴 (因為換回 22.04，這些舊套件就能正常安裝了)
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev \
            libssl-dev zip unzip autoconf automake \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev

      # 5. 安裝 Buildozer
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      # 6. 產生並修改 buildozer.spec
      - name: Create buildozer.spec
        run: |
          rm -f buildozer.spec
          buildozer init
          
          # 修改標題與包名
          sed -i 's/title = My Application/title = Mole Game/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = molegame/' buildozer.spec
          sed -i 's/package.domain = org.test/package.domain = org.test/' buildozer.spec
          
          # 加入檔案格式
          sed -i 's/source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py,png,jpg,kv,atlas,ttf,mp3,wav/' buildozer.spec
          
          # 指定 pygame
          sed -i 's/requirements = python3,kivy/requirements = python3,pygame/' buildozer.spec
          
          # 橫向螢幕
          sed -i 's/orientation = portrait/orientation = landscape/' buildozer.spec
          
          # 同意授權
          sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          
          # 顯示詳細日誌
          sed -i 's/log_level = 1/log_level = 2/' buildozer.spec

      # 7. 開始打包
      - name: Build APK
        run: |
          yes | buildozer android debug

      # 8. 上傳
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoleGame-Android
          path: bin/*.apk
