name: Build Android APK (Master Branch)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 安裝所有可能的編譯工具 (包含 libtool-bin)
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libtool libtool-bin pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev \
            libssl-dev zip unzip autoconf automake \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            autopoint gettext libltdl-dev libsqlite3-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          # 安裝最新版 buildozer
          pip install buildozer cython==0.29.36

      - name: Create buildozer.spec
        run: |
          rm -f buildozer.spec
          buildozer init
          
          # 基本設定
          sed -i 's/title = My Application/title = Mole Game/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = molegame/' buildozer.spec
          sed -i 's/package.domain = org.test/package.domain = org.test/' buildozer.spec
          sed -i 's/source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py,png,jpg,kv,atlas,ttf,mp3,wav/' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,pygame/' buildozer.spec
          sed -i 's/orientation = portrait/orientation = landscape/' buildozer.spec
          
          # ✅ 關鍵修復 1：使用 Master 分支的 python-for-android (解決 NDK r25 錯誤)
          sed -i 's/# p4a.branch = master/p4a.branch = master/' buildozer.spec
          
          # ✅ 關鍵修復 2：指定 Android 架構 (減少編譯時間與錯誤)
          sed -i 's/android.archs = arm64-v8a, armeabi-v7a/android.archs = arm64-v8a/' buildozer.spec

          # 同意授權
          sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/# android.install_test_packages = False/android.install_test_packages = True/' buildozer.spec

      - name: Build APK
        run: |
          # 使用 verbose 模式 (-v) 這樣如果失敗可以看到更詳細的原因
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoleGame-Android
          path: bin/*.apk
